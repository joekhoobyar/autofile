nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

existingSecret: ""
secrets:
  REDIS_URL: "redis://:changeme@valkey:6379/0"
  JWT_SECRET: "changeme"
  AWS_ACCESS_KEY_ID: "autofile-dev-access"
  AWS_SECRET_ACCESS_KEY: "autofile-dev-secret"

database:
  mode: cnpg
  url: ""
  cnpg:
    name: autofile-postgresql
    annotations: {}
    labels: {}
    spec:
      imageName: ghcr.io/cloudnative-pg/postgresql:18
      instances: 1
      storage:
        size: 5Gi
      bootstrap:
        initdb:
          database: autofile
          owner: autofile

virusScanning:
  # Malware scanner wiring mode: `clamav` (bundled Wiremind ClamAV subchart),
  # `external` (external ClamAV endpoint), or `disabled` (no scanner).
  provider: clamav
  # Host and port of the ClamAV `clamd` endpoint. Used when
  # `virusScanning.provider` is `clamav` or `external`.
  clamavHost: clamav
  clamavPort: 3310

objectStorage:
  mode: rustfs
  bucket: autofile-documents
  rustfs:
    existingSecret: &rustfsExistingSecret autofile-rustfs-secret
    accessKey: ""
    secretKey: ""
  initContainer:
    image:
      repository: amazon/aws-cli
      tag: latest
      pullPolicy: IfNotPresent

api:
  replicaCount: 1
  image:
    repository: ghcr.io/joekhoobyar/autofile-api
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  env:
    APP_MODE: production
    BIND_ADDR: 0.0.0.0:8000
    RUST_LOG: info
    AWS_REGION: us-east-1
    ALLOWED_ORIGINS: ""
    MAX_UPLOAD_SIZE_MB: "100"
  extraEnv: []
  startupProbe:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 30
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  resources: {}
  tmpDir:
    enabled: true
    sizeLimit: 2Gi

ui:
  replicaCount: 1
  image:
    repository: ghcr.io/joekhoobyar/autofile-ui
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  resources: {}

serviceAccount:
  create: true
  annotations: {}
  name:

podSecurityContext:
  fsGroup: 1000
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}

valkey:
  enabled: true
  auth:
    enabled: true
    usersExistingSecret: "{{ .Release.Name }}-valkey-users"
    aclUsers:
      default:
        password: ""
        permissions: "~* &* +@all"

rustfs:
  enabled: true
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  ingress:
    enabled: false
  secret:
    existingSecret: *rustfsExistingSecret

# Bundled ClamAV antivirus (Wiremind `clamav` subchart) for virus scanning.
# Deployed by default; disable with `clamav.enabled=false` together with
# `virusScanning.provider=disabled` (or `external`). Additional `clamav.*`
# values are passed through to the subchart; see its documentation for the
# full value surface. The bundled Service is named `clamav` via
# `fullnameOverride` so it matches the default `virusScanning.clamavHost`.
# Running multiple releases in one namespace requires distinct names: clear
# `clamav.fullnameOverride` and set `virusScanning.clamavHost` to
# `<release>-clamav`.
clamav:
  enabled: true
  fullnameOverride: clamav
