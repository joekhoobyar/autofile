apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "autofile.api.fullname" . }}-test-connection"
  labels:
    {{- include "autofile.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test-success
spec:
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args: ['{{ include "autofile.api.fullname" . }}:{{ .Values.api.service.port }}']
  restartPolicy: Never
