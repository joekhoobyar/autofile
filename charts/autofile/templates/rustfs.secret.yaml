{{- if include "autofile.objectStorage.isRustFS" . }}
{{- if ne .Values.rustfs.secret.existingSecret .Values.objectStorage.rustfs.existingSecret }}
{{- fail "rustfs.secret.existingSecret must match objectStorage.rustfs.existingSecret when objectStorage.mode is rustfs" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "autofile.rustfs.secretName" . }}
  labels:
    {{- include "autofile.labels" . | nindent 4 }}
type: Opaque
data:
  RUSTFS_ACCESS_KEY: {{ include "autofile.rustfs.accessKey" . | b64enc | quote }}
  RUSTFS_SECRET_KEY: {{ include "autofile.rustfs.secretKey" . | b64enc | quote }}
{{- end }}
