site_name: Autofile
site_url: https://autofile.dev/
site_description: Documentation for Autofile, a self-hosted document management application.
repo_url: https://github.com/joekhoobyar/autofile
repo_name: joekhoobyar/autofile
docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/favicon.png
  favicon: assets/favicon.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default 
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Helm: getting-started/helm.md
      - Docker Compose: getting-started/quick-start.md
      - Create the First User: getting-started/first-user.md
  - Concepts:
      - Documents: concepts/documents.md
      - Organization: concepts/organization.md
      - Metadata:
          - Overview: concepts/metadata.md
          - Document Types: concepts/document-types.md
          - Metadata Types: concepts/metadata-types.md
          - Document Metadata: concepts/document-metadata.md
      - Indexes: concepts/indexes.md
      - Classifiers: concepts/classifiers.md
      - Classifier Blocks: concepts/classifier-blocks.md
  - Administration:
      - Configuration: admin/configuration.md
      - Storage: admin/storage.md
      - Background Jobs: admin/background-jobs.md
  - Development: development/index.md
  - Reference:
      - API: reference/api.md
      - Classifier Rules YAML: reference/classifier-rules-yaml.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
