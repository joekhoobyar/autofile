services:
  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: autofile
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autofile"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: autofile-dev-access
      RUSTFS_SECRET_KEY: autofile-dev-secret
      RUSTFS_ADDRESS: :9000
      RUSTFS_CONSOLE_ADDRESS: :9001
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    volumes:
      - rustfs-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_started
    restart: "no"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until aws --endpoint-url http://rustfs:9000 s3api list-buckets >/dev/null 2>&1; do sleep 1; done
        aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket autofile-documents 2>/dev/null || true
    environment:
      AWS_ACCESS_KEY_ID: autofile-dev-access
      AWS_SECRET_ACCESS_KEY: autofile-dev-secret
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: autofile-api:latest
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      APP_MODE: development
      BIND_ADDR: 0.0.0.0:8000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/autofile
      REDIS_URL: redis://redis:6379/?connect_timeout=2&timeout=2
      AWS_ENDPOINT_URL_S3: http://rustfs:9000
      AWS_ACCESS_KEY_ID: autofile-dev-access
      AWS_SECRET_ACCESS_KEY: autofile-dev-secret
      AWS_REGION: us-east-1
      S3_BUCKET: autofile-documents
      JWT_SECRET: dev-jwt-secret-change-me
      RUST_LOG: info
    ports:
      - "8000:8000"

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: autofile-ui:latest
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
    ports:
      - "5173:8080"

volumes:
  pgdata:
  rustfs-data:
