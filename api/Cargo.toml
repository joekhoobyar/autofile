[package]
name = "autofile-api"
version = "0.4.15"
authors = ["Joe Khoobyar"]
license = "AGPL-3.0-only"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower-cookies = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
chrono = { version = "0.4", features = ["serde"] }
httpdate = "1"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
argon2 = "0.6"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
anyhow = "1"

diesel = { version = "2.3", features = ["postgres", "chrono", "serde_json"] }
diesel-async = { version = "0.9.2", features = ["postgres", "async-connection-wrapper", "bb8"] }
diesel_migrations = "2"
diesel_json = "0.3.0"
diesel_full_text_search = "2.3.0"
bb8 = "0.9.1"

aws-config = "1.1"
aws-sdk-s3 = { version = "1.15", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
uuid = { version = "1.7", features = ["v4"] }

apalis = { version = "1.0.0-rc.9", features = ["limit", "retry", "catch-panic"] }
apalis-redis = "1.0.0-rc.8"
redis = { version = "1", features = ["tokio-comp"] }

minijinja = { version = "2.18" } 
regex = "1.12.3"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
