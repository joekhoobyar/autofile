name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  api:
    name: Check API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - name: Install Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api -> target
          key: ${{ steps.rust-toolchain.outputs.cachekey }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        working-directory: api
        run: cargo fmt --all -- --check

      - name: Check API
        working-directory: api
        run: cargo check --locked --all-targets

      - name: Lint API
        working-directory: api
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test API
        working-directory: api
        run: |
          set -o pipefail
          cargo test --locked --all-targets 2>&1 | tee "$RUNNER_TEMP/api-test-output.txt"

      - name: Summarize API tests
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os
          import re

          report_path = os.path.join(os.environ.get("RUNNER_TEMP", ""), "api-test-output.txt")
          try:
              with open(report_path) as f:
                  output = f.read()
          except OSError:
              output = ""

          # libtest prints one "test result:" line per binary, e.g.
          # "test result: ok. 34 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; ..."
          pattern = re.compile(
              r"^test result:\s+(ok|FAILED)\.\s+(\d+) passed;\s+(\d+) failed;\s+(\d+) ignored;",
              re.MULTILINE,
          )
          matches = pattern.findall(output)

          print("## Rust Test Report")
          print()
          print("### Summary")
          print()
          if not matches:
              print("- ❌ **Results unavailable** · could not parse cargo test output")
          else:
              passed = sum(int(m[1]) for m in matches)
              failed = sum(int(m[2]) for m in matches)
              skipped = sum(int(m[3]) for m in matches)
              total = passed + failed + skipped
              binaries = len(matches)

              print(f"- **Test Binaries**: {binaries} total")
              results = f"✅ **{passed} {'pass' if passed == 1 else 'passes'}**"
              if failed:
                  results += f" · ❌ **{failed} {'failure' if failed == 1 else 'failures'}**"
              if skipped:
                  results += f" · ⏭️ **{skipped} skipped**"
              results += f" · {total} total"
              print(f"- **Test Results**: {results}")
          EOF

  ui:
    name: Check UI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Build UI
        working-directory: ui
        run: npm run build
