name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  api:
    name: Check API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - name: Install Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api -> target
          key: ${{ steps.rust-toolchain.outputs.cachekey }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        working-directory: api
        run: cargo fmt --all -- --check

      - name: Check API
        working-directory: api
        run: cargo check --locked --all-targets

      - name: Lint API
        working-directory: api
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test API
        working-directory: api
        run: cargo nextest run --locked --profile ci

      - name: Summarize API tests
        if: always()
        working-directory: api
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          report_path = "target/nextest/ci/junit.xml"
          try:
              root = ET.parse(report_path).getroot()
          except (OSError, ET.ParseError):
              root = None

          print("## Rust Test Report")
          print()
          print("### Summary")
          print()
          if root is None:
              print("- ❌ **Results unavailable** · could not parse nextest JUnit output")
          else:
              suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
              total = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
              failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
              errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
              skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
              failed = failures + errors
              passed = total - failed - skipped
              binaries = len(suites)

              print(f"- **Test Binaries**: {binaries} total")
              results = f"✅ **{passed} {'pass' if passed == 1 else 'passes'}**"
              if failed:
                  results += f" · ❌ **{failed} {'failure' if failed == 1 else 'failures'}**"
              if skipped:
                  results += f" · ⏭️ **{skipped} skipped**"
              results += f" · {total} total"
              print(f"- **Test Results**: {results}")
          EOF

  ui:
    name: Check UI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Build UI
        working-directory: ui
        run: npm run build
