name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  api:
    name: Check API
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libpq-dev

      - name: Install Rust toolchain
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api -> target
          key: ${{ steps.rust-toolchain.outputs.cachekey }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        working-directory: api
        run: cargo fmt --all -- --check

      - name: Check API
        working-directory: api
        run: cargo check --locked --all-targets

      - name: Lint API
        working-directory: api
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Test API
        working-directory: api
        run: |
          set -o pipefail
          cargo nextest run --locked 2>&1 | tee /tmp/nextest.log

      - name: Summarize API tests
        if: always()
        working-directory: api
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import re

          try:
              with open("/tmp/nextest.log") as f:
                  log = f.read()
          except OSError:
              log = ""

          binaries = None
          for m in re.finditer(r"Starting (\d+) tests? across (\d+) binar", log):
              binaries = int(m.group(2))

          passed = failed = skipped = None
          total = None
          for m in re.finditer(
              r"(\d+) tests? run:\s*(\d+) passed(?:,\s*(\d+) failed)?(?:,\s*(\d+) skipped)?",
              log,
          ):
              total = int(m.group(1))
              passed = int(m.group(2))
              failed = int(m.group(3)) if m.group(3) is not None else 0
              skipped = int(m.group(4)) if m.group(4) is not None else 0

          print("## Rust Test Report")
          print()
          print("### Summary")
          print()
          if total is None or passed is None:
              print("- ❌ **Results unavailable** · could not parse nextest output")
          else:
              if binaries is not None:
                  print(f"- **Test Binaries**: {binaries} total")
              results = f"✅ **{passed} {'pass' if passed == 1 else 'passes'}**"
              if failed:
                  results += f" · ❌ **{failed} {'failure' if failed == 1 else 'failures'}**"
              if skipped:
                  results += f" · ⏭️ **{skipped} skipped**"
              results += f" · {total} total"
              print(f"- **Test Results**: {results}")
          EOF

  ui:
    name: Check UI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Build UI
        working-directory: ui
        run: npm run build
