name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/extract-changelog-section.sh "${version}" CHANGELOG.md --output /tmp/release-notes.md

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease_args=()
          if [[ "${version}" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=true \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/release-notes.md \
              "${prerelease_args[@]}"
          fi

  images:
    name: Build ${{ matrix.arch }} Images
    runs-on: ${{ matrix.runner }}
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build variables
        id: build-vars
        shell: bash
        run: |
          {
            echo "GIT_SHA=$(git rev-parse --short HEAD)"
            echo "RELEASE_TAG=${GITHUB_REF_NAME}"
            echo "BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BASE_TAG=latest"
            echo "ARCH=${{ matrix.arch }}"
          } >> "$GITHUB_ENV"
          echo "bake_group=release" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: ${{ steps.build-vars.outputs.bake_group }}
          push: true

  openapi-asset:
    name: Attach OpenAPI Spec
    runs-on: ubuntu-24.04
    needs: images
    permissions:
      contents: write
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dump OpenAPI spec from release image
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/joekhoobyar/autofile-api:${GITHUB_REF_NAME}-amd64"
          docker pull "$image"
          # ENTRYPOINT is tini, so override it: appending args alone would make
          # tini try to exec the flag itself.
          docker run --rm --entrypoint /usr/local/bin/autofile-api "$image" --dump-openapi > openapi.json
          python3 -c "import json; spec = json.load(open('openapi.json')); print(f\"paths: {len(spec.get('paths', {}))}\")"
          # No checkout in this job, so name the repo explicitly (-R) instead
          # of letting gh infer it from a git remote.
          gh release upload "${GITHUB_REF_NAME}" openapi.json --clobber -R "${{ github.repository }}"

  manifests:
    name: Push Multi-Arch Manifests
    runs-on: ubuntu-24.04
    needs: images
    outputs:
      trivy-images: ${{ steps.trivy-images.outputs.images }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare manifest variables
        id: manifest-vars
        shell: bash
        run: |
          {
            echo "git_sha=$(git rev-parse --short HEAD)"
            echo "release_tag=${GITHUB_REF_NAME}"
            echo "bake_group=release"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        env:
          GIT_SHA: ${{ steps.manifest-vars.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.manifest-vars.outputs.release_tag }}
          BAKE_GROUP: ${{ steps.manifest-vars.outputs.bake_group }}
        run: |
          export GIT_SHA RELEASE_TAG
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_CREATED
          export BASE_TAG="latest"
          export ARCH="amd64"

          create_manifest() {
            tag="$1"

            docker buildx imagetools create \
              -t "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          }

          docker buildx bake --print "${BAKE_GROUP}" \
            | jq -r '.target[]?.tags[]?' \
            | while IFS= read -r arch_tag; do
                case "${arch_tag}" in
                  *-amd64)
                    create_manifest "${arch_tag%-amd64}"
                    ;;
                esac
              done

      - name: Collect Trivy image matrix
        id: trivy-images
        shell: bash
        env:
          GIT_SHA: ${{ steps.manifest-vars.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.manifest-vars.outputs.release_tag }}
          BAKE_GROUP: ${{ steps.manifest-vars.outputs.bake_group }}
        run: |
          export GIT_SHA RELEASE_TAG
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_CREATED
          export BASE_TAG="latest"
          export ARCH="amd64"

          images="$({
            docker buildx bake --print "${BAKE_GROUP}" \
              | jq --arg release_tag "${RELEASE_TAG}" -c '[.target[]?.tags[]? | select(endswith(":" + $release_tag + "-amd64")) | sub("-amd64$"; "") | { image: ., category: (sub(":([^/:]+)$"; "") | sub("^ghcr.io/"; "") | gsub("[/:.]"; "-")) }] | unique_by(.category)'
          })"

          echo "images=${images}" >> "$GITHUB_OUTPUT"

  trivy:
    name: Scan ${{ matrix.category }}
    runs-on: ubuntu-24.04
    needs: manifests
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.manifests.outputs.trivy-images) }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.category }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'

      - name: Filter SARIF to high and critical results
        shell: bash
        run: |
          jq '
            def security_severity($rules_by_id; $result):
              ($result.ruleId // "") as $rule_id
              | ($rules_by_id[$rule_id] // {}) as $rule
              | ($result.properties."security-severity" // $rule.properties."security-severity" // "0" | tonumber? // 0);

            def severity_label($rules_by_id; $result):
              ($result.ruleId // "") as $rule_id
              | ($rules_by_id[$rule_id] // {}) as $rule
              | [
                  $result.properties.severity?,
                  $result.properties.Severity?,
                  $rule.properties.severity?,
                  $rule.properties.Severity?,
                  ($rule.properties.tags[]? | strings | ascii_downcase | select(. == "critical" or . == "high" or . == "medium" or . == "low" or . == "note" or . == "warning" or . == "error")),
                  ($rule.properties.tags[]? | strings | ascii_downcase | try capture("severity[:=](?<severity>critical|high|medium|low|note|warning|error)").severity catch empty)
                ]
              | map(strings | ascii_downcase)
              | .[0] // "";

            def keep_result($rules_by_id; $result):
              (security_severity($rules_by_id; $result) >= 7)
              or ((severity_label($rules_by_id; $result) == "critical") or (severity_label($rules_by_id; $result) == "high"));

            .runs |= map(
              (.tool.driver.rules // []) as $rules
              | ($rules | map({ key: .id, value: . }) | from_entries) as $rules_by_id
              | ((.results // []) | map(select(keep_result($rules_by_id; .)))) as $results
              | ($results | map(.ruleId // empty) | unique) as $rule_ids
              | .results = $results
              | .tool.driver.rules = ($rules | map(select((.id // "") as $id | $rule_ids | index($id))))
            )
          ' "trivy-${{ matrix.category }}.sarif" > "trivy-${{ matrix.category }}-filtered.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.category }}-filtered.sarif
          category: trivy-${{ matrix.category }}

  helm-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-24.04
    needs: manifests
    outputs:
      chart-version: ${{ steps.chart-digest.outputs.chart-version }}
      chart-digest: ${{ steps.chart-digest.outputs.chart-digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Check chart version matches tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart_version="$(grep -E '^version:' charts/autofile/Chart.yaml | head -1 | awk '{print $2}')"
          app_version="$(grep -E '^appVersion:' charts/autofile/Chart.yaml | head -1 | awk '{print $2}')"
          if [ "${chart_version}" != "${version}" ]; then
            echo "Chart.yaml version ${chart_version} does not match tag ${version}" >&2
            exit 1
          fi
          if [ "${app_version}" != "v${version}" ]; then
            echo "Chart.yaml appVersion ${app_version} does not match tag v${version}" >&2
            exit 1
          fi

      - name: Log in to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Build chart dependencies
        shell: bash
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo add rustfs https://charts.rustfs.com
          helm dependency build charts/autofile

      - name: Lint and render chart
        shell: bash
        run: |
          helm lint charts/autofile --set database.mode=external --set database.url=postgres://user:pass@db:5432/autofile
          helm template autofile charts/autofile --api-versions postgresql.cnpg.io/v1/Cluster > /dev/null

      - name: Inject release notes into chart changes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/extract-changelog-section.sh "${version}" CHANGELOG.md --output /tmp/release-notes.md
          python3 .github/scripts/generate-chart-changes.py /tmp/release-notes.md > /tmp/chart-changes.yaml
          python3 - <<'EOF'
          from pathlib import Path
          chart_path = Path("charts/autofile/Chart.yaml")
          chart = chart_path.read_text()
          changes = Path("/tmp/chart-changes.yaml").read_text().strip()
          if changes:
              indented = "\n".join("    " + line if line.strip() else line for line in changes.splitlines())
              block = f"  artifacthub.io/changes: |\n{indented}\n"
              chart = chart.replace("annotations:\n", "annotations:\n" + block, 1)
              chart_path.write_text(chart)
          EOF
          grep -q 'artifacthub.io/changes' charts/autofile/Chart.yaml

      - name: Package chart
        shell: bash
        run: |
          helm package charts/autofile --destination /tmp/charts

      - name: Push chart
        shell: bash
        run: |
          chart_packages=(/tmp/charts/autofile-*.tgz)
          helm push "${chart_packages[0]}" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Push Artifact Hub repository metadata
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          oras push \
            ghcr.io/${{ github.repository_owner }}/charts/autofile:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            charts/autofile/artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Resolve chart digest
        id: chart-digest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          digest="$(oras resolve ghcr.io/${{ github.repository_owner }}/charts/autofile:${version})"
          echo "chart-version=${version}" >> "$GITHUB_OUTPUT"
          echo "chart-digest=${digest}" >> "$GITHUB_OUTPUT"

  chart-attestation:
    name: Attest Helm Chart
    runs-on: ubuntu-24.04
    needs: helm-chart
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest chart build provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/autofile
          subject-digest: ${{ needs.helm-chart.outputs.chart-digest }}
          push-to-registry: true

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [chart-attestation, openapi-asset, trivy]
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/extract-changelog-section.sh "${version}" CHANGELOG.md --output /tmp/release-notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease_args=()
          if [[ "${version}" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          gh release edit "${GITHUB_REF_NAME}" \
            --draft=false \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            "${prerelease_args[@]}"

      - name: Rebuild docs with fresh OpenAPI spec
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The docs bake openapi.json in at build time; rebuild them now that
          # the release (and its spec asset) is published.
          gh workflow run docs.yml --ref main -R "${{ github.repository }}"
