name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        default: adhoc
        options:
          - adhoc
          - base
          - rust-base
          - runtime-base

permissions:
  contents: read
  packages: write

jobs:
  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Skip non-tag release prep
        if: github.ref_type != 'tag'
        run: echo "GitHub release prep is only needed for tag builds."

      - name: Extract release notes
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/extract-changelog-section.sh "${version}" CHANGELOG.md --output /tmp/release-notes.md

      - name: Create or update draft release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease_args=()
          if [[ "${version}" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --draft=true \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/release-notes.md \
              "${prerelease_args[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --notes-file /tmp/release-notes.md \
              "${prerelease_args[@]}"
          fi

  images:
    name: Build ${{ matrix.arch }} Images
    runs-on: ${{ matrix.runner }}
    needs: draft-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build variables
        id: build-vars
        shell: bash
        run: |
          bake_group="adhoc"
          release_tag="dev"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            bake_group="release"
            release_tag="${GITHUB_REF_NAME}"
          else
            case "${{ inputs.target }}" in
              adhoc|base)
                bake_group="${{ inputs.target }}"
                ;;
              rust-base)
                bake_group="autofile-api-rust-base"
                ;;
              runtime-base)
                bake_group="autofile-api-runtime-base"
                ;;
              *)
                echo "Unsupported manual build target: ${{ inputs.target }}" >&2
                exit 1
                ;;
            esac
          fi

          {
            echo "GIT_SHA=$(git rev-parse --short HEAD)"
            echo "RELEASE_TAG=${release_tag}"
            echo "BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BASE_TAG=latest"
            echo "ARCH=${{ matrix.arch }}"
          } >> "$GITHUB_ENV"
          echo "bake_group=${bake_group}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: ${{ steps.build-vars.outputs.bake_group }}
          push: true

  manifests:
    name: Push Multi-Arch Manifests
    runs-on: ubuntu-24.04
    needs: images

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare manifest variables
        id: manifest-vars
        shell: bash
        run: |
          bake_group="adhoc"
          release_tag="dev"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            bake_group="release"
            release_tag="${GITHUB_REF_NAME}"
          else
            case "${{ inputs.target }}" in
              adhoc|base)
                bake_group="${{ inputs.target }}"
                ;;
              rust-base)
                bake_group="autofile-api-rust-base"
                ;;
              runtime-base)
                bake_group="autofile-api-runtime-base"
                ;;
              *)
                echo "Unsupported manual build target: ${{ inputs.target }}" >&2
                exit 1
                ;;
            esac
          fi

          {
            echo "git_sha=$(git rev-parse --short HEAD)"
            echo "release_tag=${release_tag}"
            echo "bake_group=${bake_group}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        env:
          GIT_SHA: ${{ steps.manifest-vars.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.manifest-vars.outputs.release_tag }}
          BAKE_GROUP: ${{ steps.manifest-vars.outputs.bake_group }}
        run: |
          export GIT_SHA RELEASE_TAG
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_CREATED
          export BASE_TAG="latest"
          export ARCH="amd64"

          create_manifest() {
            tag="$1"

            docker buildx imagetools create \
              -t "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          }

          docker buildx bake --print "${BAKE_GROUP}" \
            | jq -r '.target[]?.tags[]?' \
            | while IFS= read -r arch_tag; do
                case "${arch_tag}" in
                  *-amd64)
                    create_manifest "${arch_tag%-amd64}"
                    ;;
                esac
              done

  helm-chart:
    name: Publish Helm Chart
    runs-on: ubuntu-24.04
    needs: manifests
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Log in to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Package chart
        shell: bash
        run: |
          helm repo add valkey https://valkey.io/valkey-helm/
          helm repo add rustfs https://charts.rustfs.com
          helm dependency build charts/autofile
          helm package charts/autofile --destination /tmp/charts

      - name: Push chart
        shell: bash
        run: |
          chart_packages=(/tmp/charts/autofile-*.tgz)
          helm push "${chart_packages[0]}" oci://ghcr.io/${{ github.repository_owner }}/charts

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: helm-chart
    if: github.ref_type == 'tag'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          .github/scripts/extract-changelog-section.sh "${version}" CHANGELOG.md --output /tmp/release-notes.md

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease_args=()
          if [[ "${version}" == *-* ]]; then
            prerelease_args=(--prerelease)
          fi

          gh release edit "${GITHUB_REF_NAME}" \
            --draft=false \
            --title "${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md \
            "${prerelease_args[@]}"
