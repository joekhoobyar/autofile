name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build variables
        id: build-vars
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          bake_group="adhoc"
          release_tag="dev"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            bake_group="release"
            release_tag="${GITHUB_REF_NAME}"
          fi

          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
          echo "API_REPO=ghcr.io/${owner}/autofile-api" >> "$GITHUB_ENV"
          echo "UI_REPO=ghcr.io/${owner}/autofile-ui" >> "$GITHUB_ENV"
          echo "bake_group=${bake_group}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v6
        with:
          files: docker-bake.hcl
          targets: ${{ steps.build-vars.outputs.bake_group }}
          push: true
