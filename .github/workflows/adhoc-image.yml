name: Adhoc Image

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        default: adhoc
        options:
          - adhoc
          - base
          - rust-base
          - runtime-base

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build ${{ matrix.arch }} Images
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build variables
        id: build-vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bake_group="base"
          else
            case "${{ inputs.target }}" in
              adhoc|base)
                bake_group="${{ inputs.target }}"
                ;;
              rust-base)
                bake_group="autofile-api-rust-base"
                ;;
              runtime-base)
                bake_group="autofile-api-runtime-base"
                ;;
              *)
                echo "Unsupported manual build target: ${{ inputs.target }}" >&2
                exit 1
                ;;
            esac
          fi

          {
            echo "GIT_SHA=$(git rev-parse --short HEAD)"
            echo "RELEASE_TAG=dev"
            echo "BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BASE_TAG=latest"
            echo "ARCH=${{ matrix.arch }}"
          } >> "$GITHUB_ENV"
          echo "bake_group=${bake_group}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: ${{ steps.build-vars.outputs.bake_group }}
          push: true

  manifests:
    name: Push Multi-Arch Manifests
    runs-on: ubuntu-24.04
    needs: images
    outputs:
      trivy-images: ${{ steps.trivy-images.outputs.images }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare manifest variables
        id: manifest-vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bake_group="base"
          else
            case "${{ inputs.target }}" in
              adhoc|base)
                bake_group="${{ inputs.target }}"
                ;;
              rust-base)
                bake_group="autofile-api-rust-base"
                ;;
              runtime-base)
                bake_group="autofile-api-runtime-base"
                ;;
              *)
                echo "Unsupported manual build target: ${{ inputs.target }}" >&2
                exit 1
                ;;
            esac
          fi

          {
            echo "git_sha=$(git rev-parse --short HEAD)"
            echo "release_tag=dev"
            echo "bake_group=${bake_group}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        env:
          GIT_SHA: ${{ steps.manifest-vars.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.manifest-vars.outputs.release_tag }}
          BAKE_GROUP: ${{ steps.manifest-vars.outputs.bake_group }}
        run: |
          export GIT_SHA RELEASE_TAG
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_CREATED
          export BASE_TAG="latest"
          export ARCH="amd64"

          create_manifest() {
            tag="$1"

            docker buildx imagetools create \
              -t "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          }

          docker buildx bake --print "${BAKE_GROUP}" \
            | jq -r '.target[]?.tags[]?' \
            | while IFS= read -r arch_tag; do
                case "${arch_tag}" in
                  *-amd64)
                    create_manifest "${arch_tag%-amd64}"
                    ;;
                esac
              done

      - name: Collect Trivy image matrix
        id: trivy-images
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
          GIT_SHA: ${{ steps.manifest-vars.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.manifest-vars.outputs.release_tag }}
          BAKE_GROUP: ${{ steps.manifest-vars.outputs.bake_group }}
        run: |
          if [ "${EVENT_NAME}" != "workflow_dispatch" ] || [ "${TARGET}" != "adhoc" ]; then
            echo 'images=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          export GIT_SHA RELEASE_TAG
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_CREATED
          export BASE_TAG="latest"
          export ARCH="amd64"

          images="$({
            docker buildx bake --print "${BAKE_GROUP}" \
              | jq -c '[.target[]?.tags[]? | select(endswith("-amd64")) | sub("-amd64$"; "") | { image: ., category: (sub(":([^/:]+)$"; "") | sub("^ghcr.io/"; "") | gsub("[/:.]"; "-")) }] | unique_by(.category)'
          })"

          echo "images=${images}" >> "$GITHUB_OUTPUT"

  trivy:
    name: Scan ${{ matrix.category }}
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'adhoc'
    runs-on: ubuntu-24.04
    needs: manifests
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.manifests.outputs.trivy-images) }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.category }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'

      - name: Filter SARIF to high and critical results
        shell: bash
        run: |
          jq '
            def security_severity($rules_by_id; $result):
              ($result.ruleId // "") as $rule_id
              | ($rules_by_id[$rule_id] // {}) as $rule
              | ($result.properties."security-severity" // $rule.properties."security-severity" // "0" | tonumber? // 0);

            def severity_label($rules_by_id; $result):
              ($result.ruleId // "") as $rule_id
              | ($rules_by_id[$rule_id] // {}) as $rule
              | [
                  $result.properties.severity?,
                  $result.properties.Severity?,
                  $rule.properties.severity?,
                  $rule.properties.Severity?,
                  ($rule.properties.tags[]? | strings | ascii_downcase | select(. == "critical" or . == "high" or . == "medium" or . == "low" or . == "note" or . == "warning" or . == "error")),
                  ($rule.properties.tags[]? | strings | ascii_downcase | try capture("severity[:=](?<severity>critical|high|medium|low|note|warning|error)").severity catch empty)
                ]
              | map(strings | ascii_downcase)
              | .[0] // "";

            def keep_result($rules_by_id; $result):
              (security_severity($rules_by_id; $result) >= 7)
              or ((severity_label($rules_by_id; $result) == "critical") or (severity_label($rules_by_id; $result) == "high"));

            .runs |= map(
              (.tool.driver.rules // []) as $rules
              | ($rules | map({ key: .id, value: . }) | from_entries) as $rules_by_id
              | ((.results // []) | map(select(keep_result($rules_by_id; .)))) as $results
              | ($results | map(.ruleId // empty) | unique) as $rule_ids
              | .results = $results
              | .tool.driver.rules = ($rules | map(select((.id // "") as $id | $rule_ids | index($id))))
            )
          ' "trivy-${{ matrix.category }}.sarif" > "trivy-${{ matrix.category }}-filtered.sarif"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.category }}-filtered.sarif
          category: trivy-${{ matrix.category }}
