name: Adhoc Image

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "What to build"
        type: choice
        default: adhoc
        options:
          - adhoc
          - base
          - rust-base
          - runtime-base

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build ${{ matrix.arch }} Images
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare build variables
        id: build-vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bake_group="base"
          else
            case "${{ inputs.target }}" in
              adhoc|base)
                bake_group="${{ inputs.target }}"
                ;;
              rust-base)
                bake_group="autofile-api-rust-base"
                ;;
              runtime-base)
                bake_group="autofile-api-runtime-base"
                ;;
              *)
                echo "Unsupported manual build target: ${{ inputs.target }}" >&2
                exit 1
                ;;
            esac
          fi

          {
            echo "GIT_SHA=$(git rev-parse --short HEAD)"
            echo "RELEASE_TAG=dev"
            echo "BUILD_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "BASE_TAG=latest"
            echo "ARCH=${{ matrix.arch }}"
          } >> "$GITHUB_ENV"
          echo "bake_group=${bake_group}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: ${{ steps.build-vars.outputs.bake_group }}
          push: true

  manifests:
    name: Push Multi-Arch Manifests
    runs-on: ubuntu-24.04
    needs: images
    outputs:
      trivy-images: ${{ steps.trivy-images.outputs.images }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare manifest variables
        id: manifest-vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            bake_group="base"
          else
            case "${{ inputs.target }}" in
              adhoc|base)
                bake_group="${{ inputs.target }}"
                ;;
              rust-base)
                bake_group="autofile-api-rust-base"
                ;;
              runtime-base)
                bake_group="autofile-api-runtime-base"
                ;;
              *)
                echo "Unsupported manual build target: ${{ inputs.target }}" >&2
                exit 1
                ;;
            esac
          fi

          {
            echo "git_sha=$(git rev-parse --short HEAD)"
            echo "release_tag=dev"
            echo "bake_group=${bake_group}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        shell: bash
        env:
          GIT_SHA: ${{ steps.manifest-vars.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.manifest-vars.outputs.release_tag }}
          BAKE_GROUP: ${{ steps.manifest-vars.outputs.bake_group }}
        run: |
          export GIT_SHA RELEASE_TAG
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_CREATED
          export BASE_TAG="latest"
          export ARCH="amd64"

          create_manifest() {
            tag="$1"

            docker buildx imagetools create \
              -t "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          }

          docker buildx bake --print "${BAKE_GROUP}" \
            | jq -r '.target[]?.tags[]?' \
            | while IFS= read -r arch_tag; do
                case "${arch_tag}" in
                  *-amd64)
                    create_manifest "${arch_tag%-amd64}"
                    ;;
                esac
              done

      - name: Collect Trivy image matrix
        id: trivy-images
        shell: bash
        env:
          GIT_SHA: ${{ steps.manifest-vars.outputs.git_sha }}
          RELEASE_TAG: ${{ steps.manifest-vars.outputs.release_tag }}
          BAKE_GROUP: ${{ steps.manifest-vars.outputs.bake_group }}
        run: |
          export GIT_SHA RELEASE_TAG
          BUILD_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export BUILD_CREATED
          export BASE_TAG="latest"
          export ARCH="amd64"

          images="$({
            docker buildx bake --print "${BAKE_GROUP}" \
              | jq -c '[.target[]?.tags[]? | select(endswith("-amd64")) | sub("-amd64$"; "") | { image: ., category: (sub("^ghcr.io/"; "") | gsub("[/:.]"; "-")) }]'
          })"

          echo "images=${images}" >> "$GITHUB_OUTPUT"

  trivy:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-24.04
    needs: manifests
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.manifests.outputs.trivy-images) }}

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ matrix.category }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.category }}.sarif
          category: trivy-${{ matrix.category }}
