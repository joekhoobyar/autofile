name: Container Security

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to scan
        required: true
        type: string

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  trivy:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - image: ghcr.io/joekhoobyar/autofile-api
            category: autofile-api
          - image: ghcr.io/joekhoobyar/autofile-ui
            category: autofile-ui

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ inputs.image_tag }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: '0'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.category }}
