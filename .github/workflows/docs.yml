name: Docs

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - CHANGELOG.md
      - requirements-docs.txt
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Download OpenAPI spec
        shell: bash
        run: |
          # Bake the release openapi.json into the site so the interactive
          # reference loads same-origin (no CORS/redirect issues from the
          # browser fetching the release download URL directly).
          mkdir -p docs/assets/openapi
          curl -fsSL https://github.com/joekhoobyar/autofile/releases/latest/download/openapi.json \
            -o docs/assets/openapi/openapi.json
          python3 -c "import json; spec = json.load(open('docs/assets/openapi/openapi.json')); print(f\"openapi.json valid, paths: {len(spec.get('paths', {}))}\")"

      - name: Build site
        run: zensical build --clean --strict

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy Docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
